[target.x86_64-pc-windows-msvc]
rustflags = [
    "-C",
    "target-feature=+crt-static",
    "-Z",
    "threads=8",
    "-Z",
    "share-generics=y",
    "-Z",
    "next-solver=coherence",
]

[target.x86_64-unknown-linux-gnu]
rustflags = [
    "-Z",
    "threads=8",
    "-Z",
    "share-generics=y",
    "-Z",
    "next-solver=coherence",
]
