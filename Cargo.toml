# NOTE: `crates/installer` builds both AuroraInstaller and AuroraUninstaller and
# opts out of shared's `extract` feature to drop the archive codecs it never
# uses. Cargo unifies features per invocation, so `cargo build --workspace`
# silently gives it `extract` back. Ship those two binaries via
# ./build-installer.ps1, which builds them alone and with the size flags.
[workspace]
members = [
    "crates/main",
    "crates/backend",
    "crates/shared",
    "crates/ipc",
    "crates/updater",
    "crates/steam-wrapper",
    "crates/installer",
]
resolver = "2"

[workspace.dependencies]
slint = { version = "1.17.1", default-features = false, features = [
    "renderer-femtovg",
    "backend-winit",
    "compat-1-2",
    "unstable-fontique-010",
] }
archive = "0.3"
open = "5"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "fs"] }
log = "0.4"
anyhow = "1.0"
jwalk = "0.8"
dirs = "6"
rayon = "1.12"
twox-hash = { version = "2", default-features = false, features = [
    "xxhash3_64",
    "std",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "json",
    "rustls",
    "query",
] }
once_cell = "1"
chrono = { version = "0.4", default-features = false, features = [
    "std",
    "clock",
] }
sysinfo = { version = "0.39" }
libc = "0.2"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Ole",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_SecurityCenter",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Registry",
] }
slint-build = "1.17.1"
winresource = "0.1.31"
image = "0.25.10"
mslnk = "0.1"
md5 = "0.8.1"

# Compression is unusably slow when built unoptimized (zipping a 4.4 GB mod
# folder took ~4 min in a dev build vs ~19 s in release). Optimizing just these
# leaves our own crates fully debuggable.
[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.zlib-rs]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
