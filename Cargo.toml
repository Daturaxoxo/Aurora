[workspace]
members = [
    "crates/main",
    "crates/backend",
    "crates/shared",
    "crates/ipc",
    "crates/updater",
    "crates/steam-wrapper",
    "crates/installer",
    "crates/oneclick",
]
resolver = "3"

[workspace.dependencies]
slint = { version = "1.17.1", default-features = false, features = [
    "renderer-femtovg",
    "backend-winit",
    "compat-1-2",
    "unstable-fontique-010",
] }
archive = "0.3"
open = "5"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "fs"] }
log = "0.4"
anyhow = "1.0"
jwalk = "0.8"
dirs = "6"
rayon = "1.12"
twox-hash = { version = "2", default-features = false, features = [
    "xxhash3_64",
    "std",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = { version = "2", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "json",
    "rustls",
    "query",
] }
once_cell = "1"
chrono = { version = "0.4", default-features = false, features = [
    "std",
    "clock",
] }
sysinfo = { version = "0.39" }
libc = "0.2"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Ole",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Registry",
    "Win32_System_RestartManager",
    "Win32_Storage_FileSystem",
    "Win32_Globalization",
] }
slint-build = "1.17.1"
winresource = "0.1.31"
image = { version = "0.25.10", default-features = false, features = [
    "rayon",
    "png",
    "jpeg",
] }
mslnk = "0.1"
md5 = "0.8.1"
ureq = { version = "3", default-features = false, features = [
    "rustls",
    "platform-verifier",
    "gzip",
] }
percent-encoding = "2"
url = "2"

[profile.dev.package.flate2]
opt-level = 2

[profile.dev.package.zlib-rs]
opt-level = 2

[profile.dev.package.miniz_oxide]
opt-level = 2

[profile.dev.package.crc32fast]
opt-level = 2

[profile.dev]
debug = "line-tables-only"
panic = "abort"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 16
strip = "symbols"
panic = "abort"
